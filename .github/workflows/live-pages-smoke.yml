name: Verify published Moore Network Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-live-pages.mjs'
      - '.github/workflows/live-pages-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-pages:
    name: Actual public pages and garment image
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout read-only verification script
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate live-check script syntax
        run: node --check scripts/check-live-pages.mjs
      - name: Allow GitHub Pages to publish the new main-branch commit
        if: github.event_name == 'push'
        run: sleep 45
      - name: Verify eight public production resources
        run: node scripts/check-live-pages.mjs
